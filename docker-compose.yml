services:
  # ----------------------------------------------------
  # Backend Service (FastAPI)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      network: host
    container_name: chatanalisis-backend
    # Expose port ke jaringan internal Docker (proxy-net), TIDAK dipublikasikan ke IP publik host
    expose:
      - "8000"
    environment:
      - CORS_ORIGINS=["*"]
      # Additional parameters from .env
      - MAX_FILE_SIZE_MB=10
      - ZIP_MAX_EXTRACTED_MB=200
    volumes:
      - backend_data:/app/storage
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
    networks:
      chatanalisis-network:
        aliases:
          - backend
          - chatanalisis-backend
      proxy-net:
        aliases:
          - chatanalisis-be
          - chatanalisis-backend

volumes:
  backend_data:
    driver: local

networks:
  chatanalisis-network:
    name: chatanalisis-network
    external: true
  proxy-net:
    external: true

# ==============================================================================
# DOKUMENTASI & PANDUAN PENGGUNAAN (BACKEND DOCKER COMPOSE)
# ==============================================================================
# CARA MENJALANKAN:
# 1. Pastikan network docker sudah ada atau biarkan compose membuatnya secara otomatis.
# 2. Jalankan perintah berikut di terminal:
#    docker compose up --build -d
#
# 3. Menghentikan Layanan:
#    docker compose down
# ==============================================================================
