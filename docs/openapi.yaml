openapi: 3.1.0
info:
  title: ChatAnalisis API
  version: 1.0.0
  description: >-
    OpenAPI specification for the ChatAnalisis frontend-facing backend contract.
    The frontend uploads anonymized CSV files, dispatches async analysis jobs,
    listens to websocket progress updates, and fetches dashboard data via HTTP.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: System
  - name: Upload
  - name: Analysis
  - name: Progress
  - name: Export

paths:
  /:
    get:
      tags: [System]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: success
                    message: Server berjalan normal
                    data:
                      status: healthy
                      version: "1.0.0"

  /files/upload-chat:
    post:
      tags: [Upload]
      summary: Upload anonymized CSV chat
      operationId: uploadChat
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Anonymized CSV generated by the frontend preprocessing step.
      responses:
        "200":
          description: Upload accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "413":
          $ref: "#/components/responses/Error413"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/analyze:
    post:
      tags: [Analysis]
      summary: Enqueue analysis job
      operationId: startAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
            examples:
              enqueue:
                value:
                  session_id: s-123
                  filter: all
      responses:
        "202":
          description: Analysis job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisQueuedResponse"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/progress/ws:
    get:
      tags: [Progress]
      summary: WebSocket progress stream
      operationId: analysisProgressWebSocket
      description: >-
        WebSocket endpoint used by the frontend to receive live progress updates.
        Clients should connect with the `session_id` query parameter.
      x-websocket: true
      parameters:
        - $ref: "#/components/parameters/SessionIdQuery"
      responses:
        "101":
          description: Switching protocols for websocket upgrade

  /analysis/progress/{session_id}:
    get:
      tags: [Progress]
      summary: HTTP progress fallback
      operationId: getAnalysisProgress
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: Current job progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressResponse"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/stats/{session_id}:
    get:
      tags: [Analysis]
      summary: Get statistics for a session
      operationId: getStatistics
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/FilterQuery"
      responses:
        "200":
          description: Statistics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/topics/{session_id}:
    get:
      tags: [Analysis]
      summary: Get topic list
      operationId: getTopics
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/FilterQuery"
      responses:
        "200":
          description: Topics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicsResponse"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/topics/{session_id}/{topic_id}/messages:
    get:
      tags: [Analysis]
      summary: Get messages inside a topic
      operationId: getTopicMessages
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/TopicIdPath"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Topic message payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicMessagesResponse"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/context/{session_id}:
    get:
      tags: [Analysis]
      summary: Get message context around an index
      operationId: getMessageContext
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
        - $ref: "#/components/parameters/IndexQuery"
        - $ref: "#/components/parameters/WindowQuery"
      responses:
        "200":
          description: Message context payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"

  /analysis/export/{session_id}/csv:
    get:
      tags: [Export]
      summary: Download enriched CSV
      operationId: exportCsv
      parameters:
        - $ref: "#/components/parameters/SessionIdPath"
      responses:
        "200":
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Error404"
        "500":
          $ref: "#/components/responses/Error500"

components:
  parameters:
    SessionIdPath:
      name: session_id
      in: path
      required: true
      schema:
        type: string
      description: Session identifier generated by the upload endpoint.
    SessionIdQuery:
      name: session_id
      in: query
      required: true
      schema:
        type: string
      description: Session identifier for websocket progress subscription.
    TopicIdPath:
      name: topic_id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
      description: Topic identifier.
    FilterQuery:
      name: filter
      in: query
      required: false
      schema:
        type: string
        enum: [all, year, month, week]
        default: all
      description: Analysis filter.
    PageQuery:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IndexQuery:
      name: index
      in: query
      required: true
      schema:
        type: integer
        minimum: 0
    WindowQuery:
      name: window
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 5

  responses:
    Error400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error413:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Error500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthResponse:
      type: object
      required: [status, message, data]
      properties:
        status:
          type: string
        message:
          type: string
        data:
          type: object
          required: [status, version]
          properties:
            status:
              type: string
              example: healthy
            version:
              type: string

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
        detail:
          type: string

    UploadResponse:
      type: object
      required: [session_id, filename, total_messages]
      properties:
        session_id:
          type: string
        filename:
          type: string
        total_messages:
          type: integer
          minimum: 0

    AnalysisRequest:
      type: object
      required: [session_id, filter]
      properties:
        session_id:
          type: string
        filter:
          type: string
          enum: [all, year, month, week]
        filename:
          type: string
          description: Optional original filename for tracing.

    AnalysisQueuedResponse:
      type: object
      required: [session_id, status, message]
      properties:
        session_id:
          type: string
        status:
          type: string
          example: queued
        message:
          type: string

    ProgressResponse:
      type: object
      required: [session_id, progress, status, message]
      properties:
        session_id:
          type: string
        progress:
          type: integer
          minimum: -1
          maximum: 100
        status:
          type: string
          enum: [queued, running, completed, failed]
        message:
          type: string

    MetricsResponse:
      type: object
      properties:
        total_messages:
          type: integer
        top_sender:
          type: object
          properties:
            name:
              type: string
            count:
              type: integer
            share:
              type: number
        active_hour:
          type: object
          properties:
            label:
              type: string
            count:
              type: integer
        active_day:
          type: object
          properties:
            label:
              type: string
            count:
              type: integer

    ActivityItem:
      type: object
      properties:
        label:
          type: string
        value:
          type: number
        count:
          type: integer

    WordCloudItem:
      type: object
      properties:
        word:
          type: string
        size:
          type: number
        opacity:
          type: number
        rotate:
          type: number

    TopicMessageContext:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        time:
          type: string
        text:
          type: string
        focusIndex:
          type: integer
        context:
          type: array
          items:
            type: object

    TopicItem:
      type: object
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        title:
          type: string
        summary:
          type: string
        score:
          type: number
        message_count:
          type: integer
        keywords:
          type: array
          items:
            type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TopicMessageContext"

    StatsResponse:
      type: object
      required: [session_id, filter, metrics, activity]
      properties:
        session_id:
          type: string
        filter:
          type: string
          enum: [all, year, month, week]
        metrics:
          $ref: "#/components/schemas/MetricsResponse"
        activity:
          type: object
          properties:
            hourly:
              type: array
              items:
                $ref: "#/components/schemas/ActivityItem"
            daily:
              type: array
              items:
                $ref: "#/components/schemas/ActivityItem"
        word_cloud:
          type: array
          items:
            $ref: "#/components/schemas/WordCloudItem"

    TopicsResponse:
      type: object
      required: [session_id, filter, topics]
      properties:
        session_id:
          type: string
        filter:
          type: string
          enum: [all, year, month, week]
        topics:
          type: array
          items:
            $ref: "#/components/schemas/TopicItem"
        outlier_count:
          type: integer

    TopicMessagesResponse:
      type: object
      required: [topic_id, total, page, messages]
      properties:
        topic_id:
          oneOf:
            - type: integer
            - type: string
        topic_representation:
          type: string
        total:
          type: integer
        page:
          type: integer
        messages:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              sender:
                type: string
              timestamp:
                type: string
              text:
                type: string
              text_preprocessed:
                type: string

    ContextResponse:
      type: object
      required: [center_index, window, messages]
      properties:
        center_index:
          type: integer
        window:
          type: integer
        messages:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              sender:
                type: string
              timestamp:
                type: string
              text:
                type: string
              topic_id:
                oneOf:
                  - type: integer
                  - type: string
              is_center:
                type: boolean
